name: Build platform VSIX packages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025
          - target: web
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - name: Install dependencies
        if: matrix.target != 'web'
        run: yarn install --frozen-lockfile
      - name: Install dependencies for WebAssembly
        if: matrix.target == 'web'
        run: yarn install --frozen-lockfile --ignore-platform --force
      - run: yarn test
      - run: yarn package
        env:
          VSCE_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

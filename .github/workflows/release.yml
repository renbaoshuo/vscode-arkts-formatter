name: Release platform VSIX packages

on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-arm64
            runner: windows-11-arm
          - target: win32-x64
            runner: windows-2025

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          node -e "const expected = 'v' + require('./package.json').version;
          if (process.env.GITHUB_REF_NAME !== expected) {
          console.error('Expected tag ' + expected + ', got ' + process.env.GITHUB_REF_NAME);
          process.exit(1); }"
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn package
        env:
          VSCE_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to VS Marketplace
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - run: yarn vsce publish --oidc --packagePath dist/*.vsix

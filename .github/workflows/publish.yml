name: Publish extension

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/')
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-release-tag.mjs

  build:
    name: Build packages
    needs: version
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish ${{ matrix.registry }}
    needs: build
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        registry: [marketplace, open-vsx]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true
      - name: Publish to Visual Studio Marketplace
        if: matrix.registry == 'marketplace'
        run: yarn vsce publish --oidc --packagePath dist/*.vsix
      - name: Publish to Open VSX
        if: matrix.registry == 'open-vsx'
        run: yarn ovsx publish --trusted-publishing --packagePath dist/*.vsix
